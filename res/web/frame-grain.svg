<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">
  <!-- Subtle grain drawn over the slot fill (original artwork). -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.10  0 0 0 0 0.10  0 0 0 0 0.05  0 0 0 0.35 0" result="tint"/>
      <feComposite in="tint" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <path d="M10 2 H90 A8 8 0 0 0 98 10 V90 A8 8 0 0 0 90 98 H10 A8 8 0 0 0 2 90 V10 A8 8 0 0 0 10 2 Z"
    fill="#000" filter="url(#grain)"/>
</svg>
