<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dusklight Item Tracker</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="tp-ui.css">
</head>
<body>
  <header class="bar">
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-view="items" aria-selected="true">Items</button>
      <button type="button" role="tab" data-view="dungeons" aria-selected="false">Dungeons</button>
      <button type="button" role="tab" data-view="locations" aria-selected="false">Locations</button>
    </nav>
    <div class="bar-right">
      <button type="button" id="theme" class="tool">Options</button>
      <button type="button" id="edit" class="tool">Edit</button>
      <div class="status" id="status" data-state="connecting">
        <span class="dot" aria-hidden="true"></span>
        <span id="status-text">Connecting…</span>
      </div>
    </div>
  </header>

  <div class="edit-bar" id="edit-bar" hidden>
    <span>Click two slots (or drag one onto another) to swap them.</span>
    <span class="edit-actions">
      <button type="button" id="edit-reset" class="tool">Reset to default</button>
      <button type="button" id="edit-cancel" class="tool">Cancel</button>
      <button type="button" id="edit-confirm" class="tool primary">Confirm</button>
    </span>
  </div>

  <div class="edit-bar options-bar" id="theme-bar" hidden>
    <div class="opt-groups">
      <section class="opt-group">
        <h3 class="opt-title"><span>Display</span></h3>
        <div class="opt-row">
          <button type="button" class="swatch mode" data-mode="simple" title="The main things only: what is reachable, what is left, the map">Simple</button>
          <button type="button" class="swatch mode" data-mode="advanced" title="Everything: custom requirements, reachable regions, seeds, placing checks by hand, renaming places, details">Advanced</button>
        </div>
        <div class="opt-row">
          <label title="The map shows the region picked in Checks, and Checks the region of the place the map shows"><input type="checkbox" id="link-map"> Link Checks and Map</label>
        </div>
        <div class="opt-row adv-only">
          <button type="button" class="tool" id="export-custom" title="Download everything set by hand (checks placed on the map, Areas of checks, entrances moved / added / removed, places renamed) as map_presets.json, to be shipped with the mod">Export customizations</button>
          <span class="opt-note" id="export-note"></span>
        </div>
        <div class="opt-row">
          <span class="opt-label">Clicks on a check</span>
          <select id="click-mode" aria-label="Clicks on a check" title="In Checks and on the map: which mouse button shows a check's requirement and which only highlights it">
            <option value="left-req">Click: requirement · Right-click: highlight</option>
            <option value="left-highlight">Click: highlight · Right-click: requirement</option>
          </select>
        </div>
        <div class="opt-row">
          <span class="opt-label">Font</span>
          <select id="font-family" aria-label="Font">
            <option value="default">Standard</option>
            <option value="oldenglish">Old English</option>
            <option value="custom">My font…</option>
          </select>
          <select id="font-scope" aria-label="Where the font is used">
            <option value="titles">Titles</option>
            <option value="all">All text</option>
          </select>
          <label class="tool" id="font-upload" title="A TrueType, OpenType or WOFF font (a Hylian font, ...)">Upload font…<input type="file" id="font-file" accept=".ttf,.otf,.woff,.woff2,font/*" hidden></label>
        </div>
      </section>
      <section class="opt-group">
        <h3 class="opt-title"><span>Theme</span></h3>
        <div class="opt-row">
          <button type="button" class="swatch" data-choice="twilight"><i></i>Twilight</button>
          <button type="button" class="swatch" data-choice="midna"><i></i>Midna</button>
          <button type="button" class="swatch" data-choice="hyrule"><i></i>Hyrule</button>
          <button type="button" class="swatch" data-choice="shadow"><i></i>Shadow</button>
        </div>
      </section>
      <section class="opt-group">
        <h3 class="opt-title"><span>Background</span></h3>
        <div class="opt-row">
          <label class="tool">Upload image…<input type="file" id="bg-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></label>
          <button type="button" id="bg-remove" class="tool">Remove</button>
          <select id="bg-fit" aria-label="Image fit">
            <option value="cover">Fill</option>
            <option value="tile">Tile</option>
          </select>
        </div>
        <div class="opt-row"><label>Darken <input type="range" id="bg-dim" min="0" max="85" step="5"></label></div>
      </section>
      <section class="opt-group">
        <h3 class="opt-title"><span>Item Background</span></h3>
        <div class="opt-row">
          <select id="fill-mode" aria-label="Item background">
            <option value="theme">Theme color</option>
            <option value="custom">Custom color</option>
          </select>
          <input type="color" id="fill-color" aria-label="Item background color">
        </div>
        <div class="opt-row"><label>Opacity <input type="range" id="fill-alpha" min="0" max="100" step="5"></label></div>
        <div class="opt-row"><label title="The green light around items you have">Obtained glow <input type="range" id="glow-alpha" min="0" max="100" step="5"></label></div>
      </section>
    </div>
  </div>

  <div class="icon-editor" id="icon-editor" hidden></div>
  <div class="texture-browser" id="texture-browser" hidden></div>

  <main>
    <section id="view-items" class="view" role="tabpanel"></section>
    <section id="view-dungeons" class="view" role="tabpanel" hidden></section>
    <section id="view-locations" class="view" role="tabpanel" hidden></section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
