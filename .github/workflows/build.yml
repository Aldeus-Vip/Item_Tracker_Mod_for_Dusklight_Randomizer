name: Build

# GitHub Actions minutes are limited for private repositories (macOS runners count 10x, Windows
# 2x), so the full 8-platform build runs only for releases:
#   pull_request       -> quick check: linux-x86_64 (+ host tests) and windows-amd64
#   tag push           -> full build, combined bundle attached to a release
#   manual run         -> full build ("Run workflow" in the Actions tab); choose "quick" for a check
on:
  pull_request:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      scope:
        description: "Platforms to build"
        type: choice
        options: [full, quick]
        default: full

env:
  SYMGEN_VERSION: v1.2.4

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{steps.pick.outputs.matrix}}
      full: ${{steps.pick.outputs.full}}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - name: Pick platforms
        id: pick
        run: |
          if [[ "${{github.event_name}}" == "pull_request" || "${{inputs.scope}}" == "quick" ]]; then
            full=false
            matrix=$(jq -c '{include: map(select(.quick))}' .github/build-matrix.json)
          else
            full=true
            matrix=$(jq -c '{include: .}' .github/build-matrix.json)
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{matrix.platform}}
    needs: plan
    runs-on: ${{matrix.runner}}
    strategy:
      fail-fast: false
      matrix: ${{fromJSON(needs.plan.outputs.matrix)}}

    steps:
      - uses: actions/checkout@v7

      - name: Read pinned Dusklight version
        id: dusklight
        shell: bash
        run: echo "version=$(sed -n 's/.*set(DUSKLIGHT_VERSION "\([^"]*\)").*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Cache Dusklight sources
        uses: actions/cache@v6
        with:
          path: dusklight
          key: dusklight-${{runner.os}}-${{steps.dusklight.outputs.version}}

      - name: Enable Visual Studio environment
        if: matrix.msvc_arch
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{matrix.msvc_arch}}

      - name: Install ninja
        if: matrix.msvc_arch
        run: choco install ninja

      - name: Install Android NDK
        if: matrix.android_ndk
        uses: android-actions/setup-android@v4
        with:
          packages: ndk;${{matrix.android_ndk}}

      - name: Configure CMake
        shell: bash
        run: |
          args=(-G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo ${{matrix.cmake_args}})
          if [[ -n "${{matrix.android_ndk}}" ]]; then
            args+=(-DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/${{matrix.android_ndk}}/build/cmake/android.toolchain.cmake"
                   -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28)
          fi
          cmake -B build "${args[@]}"

      - name: Build
        run: cmake --build build --parallel

      - name: Host tests
        if: matrix.platform == 'linux-x86_64'
        run: sh tests/run.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mod-${{matrix.platform}}
          path: build/mods/*.dusk
          if-no-files-found: error

  combine:
    name: Combine bundles
    needs: [plan, build]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download platform bundles
        uses: actions/download-artifact@v8
        with:
          pattern: mod-*
          path: dist

      - name: Install symgen
        run: |
          curl -fsSL -o symgen \
            "https://github.com/encounter/symgen/releases/download/${SYMGEN_VERSION}/symgen-linux-x86_64"
          chmod +x symgen

      - name: Merge bundles
        run: |
          name=$(basename dist/mod-linux-x86_64/*.dusk)
          python3 tools/merge_mod.py -o "combined/$name" --symgen ./symgen \
            dist/*/*.dusk

      - name: Upload combined bundle
        uses: actions/upload-artifact@v7
        with:
          name: mod-combined
          path: combined/*.dusk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{github.token}}
        run: gh release create "$GITHUB_REF_NAME" combined/*.dusk --verify-tag --generate-notes
